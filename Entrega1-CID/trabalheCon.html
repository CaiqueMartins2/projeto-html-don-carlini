<body>
    <h1>Trabalhe Conosco</h1>
    <p>
        <label for="numero">
            digite seu numero:
        </label>
    </p>

    <p>
        <textarea
            id="numero"
            name="número"
            rows="2"
            cols="30"
            minlength="5"
            maxlength="50"
            placeholder="(xx) xxxxx-xxxx"
            required
        ></textarea>
    </p>
    <p>
        <label for="email">
            digite seu email:
        </label>
    
    <p>
        <textarea
            id="email"
            name="email"
            rows="2"
            cols="30"
            minlength="5"
            maxlength="50"
            placeholder="seuemail@mail.com"
            required
        ></textarea>
    </p>


    <p>
        <button type="submit">
            Enviar dados
        </button>
    </p>

    <p>Entraremos em contato o mais breve possível</p>
